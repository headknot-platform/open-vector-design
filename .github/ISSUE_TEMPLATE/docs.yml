name: 📖 Docs
description: Something in the documentation is missing, wrong, or unclear
title: "docs: <short summary>"
labels: ["type:docs", "status:triage"]
body:
  - type: textarea
    id: whats_wrong
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: File path or URL
    validations:
      required: false
