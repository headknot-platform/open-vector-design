name: 🔬 Spike / Research
description: A time-boxed investigation that produces a decision or document
title: "spike: <question>"
labels: ["type:spike", "status:triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time-box
      placeholder: e.g. 1 day
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What comes out of this — a decision, a doc, a prototype branch?
    validations:
      required: true
