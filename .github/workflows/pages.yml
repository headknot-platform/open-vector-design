# The OVD Editor demo on GitHub Pages (#1). Deploys the standalone editor's static build whenever
# dev moves. This is the repository's only workflow: it deploys, it does not gate — the pre-PR gate
# stays local (CONTRIBUTING.md).
name: Pages

on:
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @ovd/standalone build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: apps/standalone/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
