<svg xmlns="http://www.w3.org/2000/svg" xmlns:ovd="https://ovd.dev/ns/0.1" ovd:type="library" ovd:name="Button" ovd:version="0.1">
  <defs>
    <symbol id="c_button" ovd:type="component-set" ovd:name="Button" ovd:default="variant=primary,size=md" ovd:props='{"variant":["primary","secondary"],"size":["md","sm"],"label":"text"}'>
      <symbol id="c_button__primary_md" ovd:type="component" ovd:name="Primary / md" ovd:align="center" ovd:direction="row" ovd:gap="0" ovd:justify="center" ovd:layout="flex" ovd:padding="{spacing.sm} {spacing.md}" ovd:variant="variant=primary,size=md" height="44" viewBox="0 0 160 44" width="160">
        <rect ovd:fill="{color.primary}" fill="var(--color-primary, #4f46e5)" height="44" rx="8" width="160"/>
        <text id="label" ovd:type="text" ovd:name="Label" ovd:box="auto-width" ovd:content="Button" ovd:fill="{color.on-primary}" ovd:height="18" ovd:line-height="1.2" ovd:prop="label" ovd:text-style="{typography.label.md}" ovd:width="50" fill="var(--color-on-primary, #ffffff)" font-family="Inter, sans-serif" font-size="15" font-weight="600" transform="translate(55 13)">
          <tspan x="0" y="13.5">Button</tspan>
        </text>
      </symbol>
      <symbol id="c_button__secondary_md" ovd:type="component" ovd:name="Secondary / md" ovd:align="center" ovd:direction="row" ovd:gap="0" ovd:justify="center" ovd:layout="flex" ovd:padding="{spacing.sm} {spacing.md}" ovd:variant="variant=secondary,size=md" height="44" viewBox="0 0 160 44" width="160">
        <rect ovd:fill="{color.surface}" ovd:stroke="{color.border}" fill="var(--color-surface, #ffffff)" height="44" rx="8" stroke="var(--color-border, #dde1e8)" stroke-width="1" width="160"/>
        <text id="label" ovd:type="text" ovd:name="Label" ovd:box="auto-width" ovd:content="Button" ovd:fill="{color.text}" ovd:height="18" ovd:line-height="1.2" ovd:prop="label" ovd:text-style="{typography.label.md}" ovd:width="50" fill="var(--color-text, #111319)" font-family="Inter, sans-serif" font-size="15" font-weight="600" transform="translate(55 13)">
          <tspan x="0" y="13.5">Button</tspan>
        </text>
      </symbol>
      <symbol id="c_button__primary_sm" ovd:type="component" ovd:name="Primary / sm" ovd:align="center" ovd:direction="row" ovd:gap="0" ovd:justify="center" ovd:layout="flex" ovd:padding="{spacing.xs} {spacing.sm}" ovd:variant="variant=primary,size=sm" height="36" viewBox="0 0 120 36" width="120">
        <rect ovd:fill="{color.primary}" fill="var(--color-primary, #4f46e5)" height="36" rx="6" width="120"/>
        <text id="label" ovd:type="text" ovd:name="Label" ovd:box="auto-width" ovd:content="Button" ovd:fill="{color.on-primary}" ovd:height="18" ovd:line-height="1.2" ovd:prop="label" ovd:text-style="{typography.label.md}" ovd:width="50" fill="var(--color-on-primary, #ffffff)" font-family="Inter, sans-serif" font-size="15" font-weight="600" transform="translate(35 9)">
          <tspan x="0" y="13.5">Button</tspan>
        </text>
      </symbol>
      <symbol id="c_button__secondary_sm" ovd:type="component" ovd:name="Secondary / sm" ovd:align="center" ovd:direction="row" ovd:gap="0" ovd:justify="center" ovd:layout="flex" ovd:padding="{spacing.xs} {spacing.sm}" ovd:variant="variant=secondary,size=sm" height="36" viewBox="0 0 120 36" width="120">
        <rect ovd:fill="{color.surface}" ovd:stroke="{color.border}" fill="var(--color-surface, #ffffff)" height="36" rx="6" stroke="var(--color-border, #dde1e8)" stroke-width="1" width="120"/>
        <text id="label" ovd:type="text" ovd:name="Label" ovd:box="auto-width" ovd:content="Button" ovd:fill="{color.text}" ovd:height="18" ovd:line-height="1.2" ovd:prop="label" ovd:text-style="{typography.label.md}" ovd:width="50" fill="var(--color-text, #111319)" font-family="Inter, sans-serif" font-size="15" font-weight="600" transform="translate(35 9)">
          <tspan x="0" y="13.5">Button</tspan>
        </text>
      </symbol>
    </symbol>
  </defs>
</svg>
